services:
  # 1. PostgreSQL backing store for SpiceDB
  spicedb_db:
    image: postgres:16-alpine
    container_name: zero_trust_spicedb_db
    environment:
      POSTGRES_USER: spicedb
      POSTGRES_PASSWORD: spicedb_password
      POSTGRES_DB: spicedb
    ports:
      - "5432:5432"
    volumes:
      - spicedb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spicedb -d spicedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. SpiceDB schema migration runner
  spicedb_migrate:
    image: authzed/spicedb:v1.30.0
    container_name: zero_trust_spicedb_migrate
    command: migrate head --datastore-engine=postgres --datastore-conn-uri="postgres://spicedb:spicedb_password@spicedb_db:5432/spicedb?sslmode=disable"
    depends_on:
      spicedb_db:
        condition: service_healthy

  # 3. SpiceDB ReBAC service
  spicedb:
    image: authzed/spicedb:v1.30.0
    container_name: zero_trust_spicedb
    command: serve --datastore-engine=postgres --datastore-conn-uri="postgres://spicedb:spicedb_password@spicedb_db:5432/spicedb?sslmode=disable" --grpc-preshared-key="secret_preshared_key" --http-enabled=true
    ports:
      - "50051:50051"
      - "8443:8443"
    depends_on:
      spicedb_migrate:
        condition: service_completed_successfully

  # 4. Redis for feature store, rolling rate counters, and trust decay state
  redis:
    image: redis:7-alpine
    container_name: zero_trust_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. MongoDB for Configuration & Audit Store
  mongodb:
    image: mongo:7-jammy
    container_name: zero_trust_mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Control Plane API (Port 3002)
  control_plane:
    build:
      context: .
      dockerfile: Dockerfile.control_plane
    container_name: zero_trust_control_plane
    ports:
      - "3002:3002"
    environment:
      - CONTROL_PLANE_HOST=0.0.0.0
      - CONTROL_PLANE_PORT=3002
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPICEDB_GRPC_ENDPOINT=spicedb:50051
      - SPICEDB_PRESHARED_KEY=secret_preshared_key
      - SPICEDB_INSECURE=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      spicedb:
        condition: service_started

  # 8. Data Plane Gateway (Port 3003)
  data_plane:
    build:
      context: .
      dockerfile: Dockerfile.data_plane
    container_name: zero_trust_data_plane
    ports:
      - "3003:3003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:

      - DATA_PLANE_HOST=0.0.0.0
      - DATA_PLANE_PORT=3003
      - CONTROL_PLANE_URL=http://control_plane:3002
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPICEDB_GRPC_ENDPOINT=spicedb:50051
      - SPICEDB_PRESHARED_KEY=secret_preshared_key
      - SPICEDB_INSECURE=true
    depends_on:
      - control_plane
      - mongodb
      - redis
      - spicedb

  # 9. Frontend Admin Dashboard (Port 3001)
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zero_trust_dashboard
    ports:
      - "3001:3001"
    environment:
      - VITE_CONTROL_PLANE_URL=http://localhost:3002
      - VITE_DATA_PLANE_URL=http://localhost:3003
    depends_on:
      - control_plane
      - data_plane

volumes:
  spicedb_pgdata:
  redis_data:
  mongo_data:
