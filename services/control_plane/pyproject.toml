[project]
name = "control-plane"
version = "0.1.0"
description = "Control Plane service managing gateway upstreams, routes, and middlewares"
requires-python = ">=3.12"
dependencies = [
    "audit",
    "decision-engine",
    "fastapi>=0.111.0",
    "motor>=3.4.0",
    "redis>=5.0.0",
    "shared",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
audit = { workspace = true }
decision-engine = { workspace = true }
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
