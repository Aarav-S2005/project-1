[project]
name = "data-plane"
version = "0.1.0"
description = "Data Plane proxy gateway with dynamic routing and policy evaluation"
requires-python = ">=3.12"
dependencies = [
    "audit",
    "decision-engine",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "shared",
    "trust-engine",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
audit = { workspace = true }
decision-engine = { workspace = true }
shared = { workspace = true }
trust-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
