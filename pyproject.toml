[project]
name = "zero-trust-gateway-root"
version = "0.1.0"
description = "Zero-Trust API Gateway with Fine-Grained, Graph-Aware Authorization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "audit",
    "control-plane",
    "data-plane",
    "decision-engine",
    "shared",
    "trust-engine",
]

[tool.uv.sources]
audit = { workspace = true }
control-plane = { workspace = true }
data-plane = { workspace = true }
decision-engine = { workspace = true }
shared = { workspace = true }
trust-engine = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/audit",
    "packages/decision_engine",
    "packages/shared",
    "packages/trust_engine",
    "services/control_plane",
    "services/data_plane",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "fakeredis>=2.20.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
